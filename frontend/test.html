<!DOCTYPE html>
<html>
<head>
    <title>Chat Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #status { padding: 10px; margin: 10px 0; }
        .connected { background: green; color: white; }
        .disconnected { background: red; color: white; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; padding: 5px; border-left: 3px solid #ccc; }
        .system { border-left-color: blue; }
        .user { border-left-color: green; }
        .server { border-left-color: orange; }
    </style>
</head>
<body>
    <h1>Chat Server Test</h1>
    
    <div id="status" class="disconnected">Disconnected</div>
    
    <div>
        <input type="text" id="messageInput" placeholder="Type a message">
        <button onclick="sendMessage()">Send</button>
        <button onclick="testAPI()">Test API</button>
    </div>
    
    <!-- Room Selection -->
    <div class="room-section" style="margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 8px;">
        <h3 style="margin-top: 0; color: #333;">🎯 Chat Rooms</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="roomInput" placeholder="Enter room name" 
                   style="flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 4px;">
            <button onclick="joinRoom()" 
                    style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Join Room
            </button>
        </div>
        <div style="margin-top: 10px; font-weight: bold;">
            Current room: <span id="roomName" style="color: #2196F3;">general</span>
        </div>
        <div style="margin-top: 10px;">
            <button onclick="joinRoom('general')" style="margin-right: 5px; padding: 5px 10px;">General</button>
            <button onclick="joinRoom('random')" style="margin-right: 5px; padding: 5px 10px;">Random</button>
            <button onclick="joinRoom('help')" style="margin-right: 5px; padding: 5px 10px;">Help</button>
        </div>
    </div>
    
    <div id="messages"></div>
    
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script>
        // Connect to server
        const socket = io('http://localhost:3000');
        const messagesDiv = document.getElementById('messages');
        const statusDiv = document.getElementById('status');
        
        // Room management
        let currentRoom = 'general';
        
        // Connection events
socket.on('connect', () => {
    statusDiv.className = 'connected';
    statusDiv.textContent = '✅ Connected to server';
    
    // Auto-join general room when connected
    socket.emit('joinRoom', 'general');
});
        
        socket.on('disconnect', () => {
            statusDiv.className = 'disconnected';
            statusDiv.textContent = '❌ Disconnected';
            addMessage('Disconnected from server', 'system', 'System');
        });
        
        socket.on('welcome', (data) => {
            addMessage(`${data.message} (Your ID: ${data.id.substring(0, 8)}...)`, 'server', 'Server');
        });
        
        socket.on('newMessage', (data) => {
            addMessage(`${data.text}`, 'server', `User ${data.user}`);
        });
        
        socket.on('roomJoined', (data) => {
            addMessage(`✅ ${data.message}`, 'system', 'System');
            addMessage(`📡 Connected to chat server`, 'system', 'System');
        });
        
        socket.on('userJoined', (data) => {
            addMessage(`User ${data.user} joined the room`, 'system', 'System');
        });
        
        socket.on('roomHistory', (data) => {
            console.log('Room history received:', data.messages.length, 'messages');
            
            // Clear messages when loading new room history
            messagesDiv.innerHTML = '';
            
            addMessage(`=== Room: ${data.room} ===`, 'system', 'System');
            addMessage(`Loaded ${data.messages.length} previous messages`, 'system', 'System');
            
            if (data.messages.length === 0) {
                addMessage('No previous messages in this room', 'system', 'System');
            } else {
                data.messages.forEach(msg => {
                    addMessage(msg.text, 'server', `User ${msg.user} (${msg.time})`);
                });
            }
        });
        
        // Functions
        function joinRoom(roomName) {
            let room = '';
            
            if (roomName) {
                room = roomName.toString().toLowerCase().trim();
            } else {
                const roomInput = document.getElementById('roomInput');
                room = roomInput.value.toString().toLowerCase().trim() || 'general';
            }
            
            console.log('Joining room:', room);
            
            if (room !== currentRoom) {
                socket.emit('joinRoom', room);
                currentRoom = room;
                document.getElementById('roomName').textContent = room;
                
                // Clear input if used
                if (!roomName) document.getElementById('roomInput').value = '';
            } else {
                addMessage(`You're already in room: ${room}`, 'system', 'System');
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text) {
                socket.emit('chatMessage', { 
                    text: text,
                    room: currentRoom 
                });
                addMessage(text, 'user', 'You');
                input.value = '';
                input.focus();
            }
        }
        
        function testAPI() {
            fetch('http://localhost:3000/api/health')
                .then(r => r.json())
                .then(data => addMessage(`API: ${data.message} (DB: ${data.database})`, 'server', 'Server'))
                .catch(err => addMessage(`API Error: ${err.message}`, 'system', 'System'));
        }
        
        function addMessage(text, type, sender) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = `${sender}: ${text}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Allow Enter key to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
